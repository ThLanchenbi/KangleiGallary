<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Gallery - Kanglei Gallery</title>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #00A86B;
            min-height: 100vh;
            padding: 30px 20px 90px 20px; /* Space for bottom nav */
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            flex: 1;
            width: 100%;
        }

        /* Header Styling */
        header {
            text-align: center;
            margin-bottom: 25px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.15);
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        header p {
            font-size: 0.95rem;
            opacity: 0.95;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.4;
        }

        /* Search Bar */
        .controls-bar {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .search-box {
            position: relative;
            width: 100%;
            max-width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 12px 42px 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            font-size: 0.95rem;
            outline: none;
            background: rgba(255, 255, 255, 0.98);
            color: #1a1a1a;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .search-box i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
        }

        /* Master Player Box - Wide, Frozen/Sticky on Scroll with Glow Effect */
        .master-player-bar {
            position: sticky;
            top: 15px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 16px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 25px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
            animation: playerGlow 3s infinite alternate;
        }

        @keyframes playerGlow {
            0% {
                box-shadow: 0 8px 25px rgba(0, 0, 0, 0.18), 0 0 0px rgba(255, 255, 255, 0.2);
            }
            100% {
                box-shadow: 0 12px 35px rgba(0, 0, 0, 0.28), 0 0 18px rgba(255, 255, 255, 0.6);
            }
        }

        .now-playing-info {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            min-width: 0;
        }

        .disc-icon-wrapper {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #00A86B, #007a4d);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 3px 10px rgba(0, 168, 107, 0.3);
        }

        .disc-icon-wrapper i {
            font-size: 1.4rem;
            color: #ffffff;
        }

        .disc-icon-wrapper.playing i {
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .np-text {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .np-title {
            font-size: 1rem;
            font-weight: 800;
            color: #111827;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .np-subtitle {
            font-size: 0.82rem;
            color: #4b5563;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-controls-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Shuffle Button Style */
        .shuffle-btn {
            background: #e8f5e9;
            color: #00A86B;
            border: 1px solid #c8e6c9;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .shuffle-btn:hover {
            background: #d0ebd2;
        }

        .shuffle-btn.active {
            background: #00A86B;
            color: #ffffff;
            border-color: #007a4d;
            box-shadow: 0 3px 10px rgba(0, 168, 107, 0.4);
        }

        .master-audio-element {
            width: 280px;
            height: 40px;
            outline: none;
            border-radius: 20px;
        }

        /* Slim Audio List Layout */
        .audio-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 30px;
        }

        .audio-row-card {
            background-color: rgba(255, 255, 255, 0.96);
            border-radius: 10px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .audio-row-card:hover {
            background-color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.12);
        }

        .audio-row-card.active {
            border-color: #004d26;
            background-color: #f0fdf4;
        }

        .audio-meta {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            min-width: 0;
        }

        .audio-mini-icon {
            width: 38px;
            height: 38px;
            background: #e8f5e9;
            color: #00A86B;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .audio-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .audio-title-artist {
            font-size: 0.95rem;
            font-weight: 700;
            color: #111827;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .audio-title-artist span {
            font-weight: 500;
            color: #4b5563;
            font-size: 0.85rem;
        }

        .audio-desc {
            font-size: 0.8rem;
            color: #6b7280;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .select-hint {
            font-size: 0.8rem;
            font-weight: 700;
            color: #00A86B;
            background: #e8f5e9;
            padding: 6px 12px;
            border-radius: 6px;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .audio-row-card:hover .select-hint {
            background: #00A86B;
            color: #ffffff;
        }

        .no-results {
            background: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            color: #4b5563;
            font-size: 1rem;
            font-weight: 600;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            background-color: rgba(255, 255, 255, 0.98);
            border-top: 1px solid rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-around;
            padding: 14px;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            z-index: 70;
        }

        .nav-link {
            text-decoration: none;
            color: #00A86B;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: #007a4d;
        }

        @media (max-width: 768px) {
            .master-player-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
                padding: 14px 16px;
                top: 10px;
            }
            .master-audio-element {
                width: 100%;
            }
            .player-controls-right {
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <h1>Song Gallery</h1>
            <p>Select a track below and play it using the player at the top.</p>
        </header>

        <!-- Search Control -->
        <div class="controls-bar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search songs..." onkeyup="filterSongs()">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
        </div>

        <!-- Master Player Bar -->
        <div class="master-player-bar" id="playerBar">
            <div class="now-playing-info">
                <div class="disc-icon-wrapper" id="discWrapper">
                    <i class="fa-solid fa-compact-disc"></i>
                </div>
                <div class="np-text">
                    <span class="np-title" id="npTitle">Select a track</span>
                    <span class="np-subtitle" id="npSubtitle">Ready to play</span>
                </div>
            </div>
            
            <div class="player-controls-right">
                <!-- Shuffle Toggle Button -->
                <button class="shuffle-btn" id="shuffleBtn" onclick="toggleShuffle()" title="Toggle Shuffle">
                    <i class="fa-solid fa-shuffle"></i>
                </button>
                <audio id="masterAudio" class="master-audio-element" controls preload="none">
                    Your browser does not support the audio element.
                </audio>
            </div>
        </div>

        <!-- Slim Audio List -->
        <div class="audio-list" id="audioList">
            <!-- Rendered dynamically via JavaScript -->
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a href="register.html" class="nav-link"><i class="fa-solid fa-user-plus"></i> Register</a>
        <a href="login.html" class="nav-link"><i class="fa-solid fa-right-to-bracket"></i> Log In</a>
        <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a>
    </div>

    <script>
        // Unique IDs and exact file paths matching your repository folder structure
        const songs = [
            { id: 1, title: "Karamna Utlashige", artist: "AIGiten", description: "Soul-touching traditional rhythm.", audioUrl: "audio/karamna.mp3" },
            { id: 2, title: "Punshigi Anganba Ayukta", artist: "AIGiten", description: "Performed with classic style.", audioUrl: "audio/punshigi%20anganba%20ayukta.mp3" },
            { id: 3, title: "Nisha Nisha", artist: "AIGiten", description: "Expressive instrumental arrangement.", audioUrl: "audio/nisha%20nisha.mp3" },
            { id: 4, title: "Sumhatpa Helline", artist: "Kumar Sano", description: "Manipuri evergreen song.", audioUrl: "audio/sumhatpa%20Helline.mp3" },
            { id: 5, title: "Kanagi Wakhalda", artist: "Shyam", description: "Soul-touching old Manipuri song.", audioUrl: "audio/kanagi%20wakhalda.mp3" },
            { id: 6, title: "Leichilgi Meichak", artist: "L. Mema", description: "Performed with classic style.", audioUrl: "audio/Leichilgi%20Meichak.mp3" },
            { id: 7, title: "Pirangi Marup", artist: "Local Artists", description: "Melodic cultural composition.", audioUrl: "audio/sumhatpa.mp3" },
            { id: 8, title: "Wahang Amagi", artist: "Traditional", description: "Folk music piece.", audioUrl: "audio/Wahang amagi wakhalda (pK1cpnCT-NM.mp3"},
         { id: 9, title: "Karamna Utlashige", artist: "AIGiten", description: "Soul-touching traditional rhythm.", audioUrl: "audio/karamna.mp3" },
];
        const masterAudio = document.getElementById('masterAudio');
        const discWrapper = document.getElementById('discWrapper');
        const shuffleBtn = document.getElementById('shuffleBtn');

        let isShuffleOn = false;
        let currentSongId = null;

        // Spin CD icon on play, stop spinning on pause
        masterAudio.onplay = () => discWrapper.classList.add('playing');
        masterAudio.onpause = () => discWrapper.classList.remove('playing');

        function toggleShuffle() {
            isShuffleOn = !isShuffleOn;
            shuffleBtn.classList.toggle('active', isShuffleOn);
        }

        // When a song ends, automatically go to next or shuffle random
        masterAudio.onended = () => {
            if (songs.length === 0) return;

            let nextSong;
            if (isShuffleOn) {
                let availableSongs = songs.filter(s => s.id !== currentSongId);
                if (availableSongs.length === 0) availableSongs = songs;
                const randomIndex = Math.floor(Math.random() * availableSongs.length);
                nextSong = availableSongs[randomIndex];
            } else {
                const currentIndex = songs.findIndex(s => s.id === currentSongId);
                const nextIndex = (currentIndex + 1) % songs.length;
                nextSong = songs[nextIndex];
            }

            if (nextSong) {
                selectAndPlaySong(nextSong);
            }
        };

        function renderSongs(songArray) {
            const container = document.getElementById('audioList');
            container.innerHTML = '';

            if (songArray.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <i class="fa-solid fa-music" style="color:#00A86B; margin-right:8px;"></i> No songs found.
                    </div>
                `;
                return;
            }

            songArray.forEach((song) => {
                const card = document.createElement('div');
                card.className = 'audio-row-card';
                if (song.id === currentSongId) card.classList.add('active');
                card.id = `song-card-${song.id}`;
                card.innerHTML = `
                    <div class="audio-meta">
                        <div class="audio-mini-icon">
                            <i class="fa-solid fa-music"></i>
                        </div>
                        <div class="audio-details">
                            <div class="audio-title-artist">${song.title} <span>— ${song.artist}</span></div>
                            <div class="audio-desc">${song.description}</div>
                        </div>
                    </div>
                    <div class="select-hint"><i class="fa-solid fa-play"></i> Play</div>
                `;
                
                card.onclick = () => selectAndPlaySong(song);
                container.appendChild(card);
            });
        }

        function selectAndPlaySong(song) {
            currentSongId = song.id;
            document.querySelectorAll('.audio-row-card').forEach(c => c.classList.remove('active'));
            const selectedCard = document.getElementById(`song-card-${song.id}`);
            if (selectedCard) selectedCard.classList.add('active');

            document.getElementById('npTitle').textContent = song.title;
            document.getElementById('npSubtitle').textContent = `${song.artist} — ${song.description}`;

            masterAudio.src = song.audioUrl;
            masterAudio.play();
        }

        function filterSongs() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = songs.filter(s => 
                s.title.toLowerCase().includes(query) || 
                s.artist.toLowerCase().includes(query) ||
                s.description.toLowerCase().includes(query)
            );
            renderSongs(filtered);
        }

        renderSongs(songs);
    </script>
</body>
</html>
