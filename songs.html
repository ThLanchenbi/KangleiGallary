<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanglei Art Gallery - Audio Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #8b0000;
            margin-bottom: 20px;
        }

        /* Player Container */
        .player-container {
            background: #fafafa;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
        }

        .now-playing {
            font-weight: bold;
            margin-bottom: 10px;
            color: #555;
        }

        audio {
            width: 100%;
        }

        /* Playlist Styling */
        .playlist {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .track-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }

        .track-item:hover {
            background-color: #f0f0f0;
        }

        .track-item.active {
            background-color: #fbf0f0;
            font-weight: bold;
            color: #8b0000;
        }

        .play-btn {
            font-size: 14px;
            color: #8b0000;
        }
    </style>
</head>
<body>

    <h1>Kanglei Art Gallery Songs</h1>

    <!-- Main Audio Player -->
    <div class="player-container">
        <div class="now-playing" id="nowPlaying">Now Playing: Track 1 (Google Drive Track)</div>
        <audio id="mainAudioPlayer" controls>
            <source id="audioSource" src="https://drive.google.com/uc?export=download&id=1Tlz8d5_SA6SUx1uOBITrIuWPPfdJBtch" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>

    <!-- Song List -->
    <ul class="playlist" id="playlist">
        <!-- Track 1: Google Drive -->
        <li class="track-item active" data-src="https://drive.google.com/uc?export=download&id=1Tlz8d5_SA6SUx1uOBITrIuWPPfdJBtch" data-title="Track 1 (Google Drive Track)" onclick="selectAndPlay(this)">
            <span>1. Track 1 (Google Drive Track)</span>
            <span class="play-btn">▶ Play</span>
        </li>

        <!-- Track 2: Catbox -->
        <li class="track-item" data-src="https://files.catbox.moe/fmnehf.mp3" data-title="Track 2 (Catbox Track)" onclick="selectAndPlay(this)">
            <span>2. Track 2 (Catbox Track)</span>
            <span class="play-btn">▶ Play</span>
        </li>

        <!-- Track 3 Placeholder -->
        <li class="track-item" data-src="YOUR_THIRD_DIRECT_MP3_LINK.mp3" data-title="Track 3 (Cultural Track)" onclick="selectAndPlay(this)">
            <span>3. Track 3 (Cultural Track)</span>
            <span class="play-btn">▶ Play</span>
        </li>
    </ul>

    <script>
        var player = document.getElementById('mainAudioPlayer');
        var source = document.getElementById('audioSource');
        var titleDisplay = document.getElementById('nowPlaying');
        var trackItems = document.querySelectorAll('.track-item');
        var currentTrackIndex = 0;

        function selectAndPlay(element) {
            // Find index of clicked track
            trackItems.forEach(function(item, index) {
                if (item === element) {
                    currentTrackIndex = index;
                }
            });
            playCurrentTrack();
        }

        function playCurrentTrack() {
            var currentItem = trackItems[currentTrackIndex];
            var url = currentItem.getAttribute('data-src');
            var title = currentItem.getAttribute('data-title');

            // Update Audio Source & Title
            source.src = url;
            titleDisplay.textContent = "Now Playing: " + title;

            // Highlight Active Track
            trackItems.forEach(function(item) {
                item.classList.remove('active');
            });
            currentItem.classList.add('active');

            // Reload & Play
            player.load();
            player.play();
        }

        // Auto-play next track when current track ends
        player.onended = function() {
            currentTrackIndex++;
            if (currentTrackIndex < trackItems.length) {
                playCurrentTrack();
            } else {
                // Restart from first track if at end of playlist
                currentTrackIndex = 0;
                playCurrentTrack();
            }
        };
    </script>

</body>
</html>
