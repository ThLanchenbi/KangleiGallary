<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanglei Art Gallery - MP3 Songs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #8b0000;
            margin-bottom: 20px;
        }

        /* Main Player Styling */
        .player-container {
            background: #fafafa;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
        }

        .now-playing {
            font-weight: bold;
            margin-bottom: 10px;
            color: #555;
        }

        audio {
            width: 100%;
        }

        /* Playlist Styling */
        .playlist {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .track-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }

        .track-item:hover {
            background-color: #f0f0f0;
        }

        .track-item.active {
            background-color: #fbf0f0;
            font-weight: bold;
            color: #8b0000;
        }

        .play-btn {
            font-size: 14px;
            color: #8b0000;
        }
    </style>
</head>
<body>

    <h1>Kanglei Art Gallery Songs</h1>

    <!-- Main Audio Player -->
    <div class="player-container">
        <div class="now-playing" id="nowPlaying">Now Playing: Track 1 (Catbox Audio)</div>
        <audio id="mainAudioPlayer" controls>
            <source id="audioSource" src="https://files.catbox.moe/fmnehf.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>

    <!-- Interactive Song List -->
    <ul class="playlist">
        <!-- Sample 1: Your Catbox Direct Link -->
        <li class="track-item active" onclick="playSong('https://files.catbox.moe/fmnehf.mp3', 'Track 1 (Catbox Audio)', this)">
            <span>1. Track 1 (Catbox Audio)</span>
            <span class="play-btn">▶ Play</span>
        </li>

        <!-- Sample 2 Placeholder -->
        <li class="track-item" onclick="playSong('YOUR_SECOND_CATBOX_LINK.mp3', 'Track 2: Traditional Folk Melody', this)">
            <span>2. Track 2: Traditional Folk Melody</span>
            <span class="play-btn">▶ Play</span>
        </li>

        <!-- Sample 3 Placeholder -->
        <li class="track-item" onclick="playSong('YOUR_THIRD_CATBOX_LINK.mp3', 'Track 3: Gallery Background Track', this)">
            <span>3. Track 3: Gallery Background Track</span>
            <span class="play-btn">▶ Play</span>
        </li>
    </ul>

    <script>
        function playSong(url, title, element) {
            var player = document.getElementById('mainAudioPlayer');
            var source = document.getElementById('audioSource');
            var titleDisplay = document.getElementById('nowPlaying');
            var items = document.querySelectorAll('.track-item');

            // Update Audio Source and Title
            source.src = url;
            titleDisplay.textContent = "Now Playing: " + title;

            // Highlight Selected Track
            items.forEach(function(item) {
                item.classList.remove('active');
            });
            element.classList.add('active');

            // Load and Play Instantly
            player.load();
            player.play();
        }
    </script>

</body>
</html>
