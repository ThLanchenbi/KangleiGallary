<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanglei Art Gallery - YouTube Audio Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #8b0000;
            margin-bottom: 20px;
        }

        .video-card {
            background: #fafafa;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
        }

        .video-card h3 {
            margin-top: 0;
            color: #8b0000;
            font-size: 16px;
        }

        /* Responsive YouTube Container */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 4px;
            border: none;
        }
    </style>
</head>
<body>

    <h1>Kanglei Art Gallery Tracks</h1>

    <!-- Track 1: YouTube Embed -->
    <div class="video-card">
        <h3>Sample 1: Traditional Gallery Track</h3>
        <div class="video-container">
            <!-- Replace YOUTUBE_VIDEO_ID_1 with your actual YouTube ID -->
            <iframe src="https://www.youtube.com/embed/YOUTUBE_VIDEO_ID_1" allowfullscreen></iframe>
        </div>
    </div>

    <!-- Track 2: YouTube Embed -->
    <div class="video-card">
        <h3>Sample 2: Cultural Background Music</h3>
        <div class="video-container">
            <!-- Replace YOUTUBE_VIDEO_ID_2 with your actual YouTube ID -->
            <iframe src="https://www.youtube.com/embed/YOUTUBE_VIDEO_ID_2" allowfullscreen></iframe>
        </div>
    </div>

</body>
</html>
