<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Reader - Kanglei Gallery</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6c5ce7;
            --bg-color: #f4f6fb;
            --card-bg: #ffffff;
            --text-main: #2d3436;
        }

        body.dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .reader-header {
            background: var(--card-bg);
            border-bottom: 1px solid #ddd;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1rem;
            color: var(--text-main);
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .icon-btn:hover {
            background-color: rgba(0,0,0,0.08);
        }

        .reader-body {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .pdf-frame {
            width: 100%;
            max-width: 1000px;
            height: 100%;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- Reader Top Navigation -->
    <div class="reader-header">
        <a href="books.html" class="icon-btn">
            <i class="fa-solid fa-arrow-left"></i> Back to Gallery
        </a>
        <div style="display: flex; gap: 10px;">
            <a id="downloadBtn" href="#" download class="icon-btn">
                <i class="fa-solid fa-download"></i> Download PDF
            </a>
            <button class="icon-btn" onclick="toggleDarkMode()">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </div>

    <!-- PDF Viewer Body -->
    <div class="reader-body" id="readerBody">
        <!-- PDF injected via JavaScript -->
    </div>

    <script>
        // Read the file parameter from the URL
        const urlParams = new URLSearchParams(window.location.search);
        const pdfFile = urlParams.get('file');

        const readerBody = document.getElementById('readerBody');
        const downloadBtn = document.getElementById('downloadBtn');

        if (pdfFile) {
            downloadBtn.href = pdfFile;
            readerBody.innerHTML = `
                <iframe class="pdf-frame" src="${pdfFile}">
                    <p>Your browser does not support PDFs. <a href="${pdfFile}">Download PDF</a></p>
                </iframe>
            `;
        } else {
            readerBody.innerHTML = '<h3 style="text-align: center; color: var(--text-main);">No PDF file specified. Please go back and select a book.</h3>';
        }

        // Toggle Dark Mode
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }
    </script>
</body>
</html>
