<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Creative Library</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: #121417;
            color: #e1e3e6;
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding: 20px;
            background: #1c1f24;
            border-radius: 12px;
            border: 1px solid #2d3239;
        }

        .header h2 {
            font-size: 1.3rem;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-logout {
            background: #da3633;
            color: #ffffff;
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .btn-logout:hover {
            background: #b82d2a;
        }

        /* HERO BANNER */
        .hero-banner {
            background: linear-gradient(135deg, #1f6feb 0%, #1a4fba 100%);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 24px rgba(31, 111, 235, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .banner-content h1 {
            color: #ffffff;
            font-size: 1.6rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .banner-content p {
            color: #d0d7de;
            font-size: 0.95rem;
        }

        .btn-hero {
            background: #238636;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.05rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 12px rgba(35, 134, 54, 0.4);
            transition: transform 0.15s ease, background 0.15s ease;
            white-space: nowrap;
        }

        .btn-hero:hover {
            background: #2ea043;
            transform: translateY(-2px);
        }

        /* CARD GRID */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .card {
            background: #1c1f24;
            border: 1px solid #2d3239;
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-title {
            font-size: 0.9rem;
            color: #8b949e;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 16px;
        }

        .card-btn {
            background: #23272e;
            color: #58a6ff;
            border: 1px solid #30363d;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            transition: background 0.2s, border-color 0.2s;
            display: inline-block;
        }

        .card-btn:hover {
            background: #30363d;
            border-color: #8b949e;
            color: #ffffff;
        }

        @media (max-width: 600px) {
            .hero-banner {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }

            .btn-hero {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <div class="header">
        <h2><i class="fas fa-book-reader" style="color: #388bfd;"></i> Creative Hub</h2>
        <a href="login.html" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>

    <!-- HERO BANNER -->
    <div class="hero-banner">
        <div class="banner-content">
            <h1><i class="fas fa-feather-alt" style="color: #58a6ff;"></i> Explore Stories & Poetry</h1>
            <p>Discover collection of books, short stories, poems, and insightful articles.</p>
        </div>
        <a href="story.html" class="btn-hero">
            <i class="fas fa-book-open"></i> READ STORIES
        </a>
    </div>

    <!-- DASHBOARD NAVIGATION GRID -->
    <div class="grid">
        <!-- POEMS -->
        <div class="card">
            <div>
                <div class="card-title"><i class="fas fa-pen-nib" style="color: #e3b341;"></i> Poetry</div>
                <div class="card-value">Poems Collection</div>
            </div>
            <a href="poem.html" class="card-btn"><i class="fas fa-arrow-right"></i> Read Poems</a>
        </div>

        <!-- STORIES -->
        <div class="card">
            <div>
                <div class="card-title"><i class="fas fa-book-open" style="color: #388bfd;"></i> Short Stories</div>
                <div class="card-value">Story Corner</div>
            </div>
            <a href="story.html" class="card-btn"><i class="fas fa-arrow-right"></i> Read Stories</a>
        </div>

        <!-- BOOKS -->
        <div class="card">
            <div>
                <div class="card-title"><i class="fas fa-book" style="color: #2ea043;"></i> Books</div>
                <div class="card-value">Digital Library</div>
            </div>
            <a href="book.html" class="card-btn"><i class="fas fa-arrow-right"></i> Browse Books</a>
        </div>

        <!-- ARTICLES / MORE -->
        <div class="card">
            <div>
                <div class="card-title"><i class="fas fa-newspaper" style="color: #f85149;"></i> Articles</div>
                <div class="card-value">Featured Reads</div>
            </div>
            <a href="article.html" class="card-btn"><i class="fas fa-arrow-right"></i> Read Articles</a>
        </div>
    </div>
</div>

</body>
</html>
