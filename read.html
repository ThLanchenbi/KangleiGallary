<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Reader - Kanglei Gallery</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6c5ce7;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
        }

        body.light-mode {
            --bg-color: #f4f6fb;
            --card-bg: #ffffff;
            --text-main: #2d3436;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none; /* Disables text highlighting */
        }

        /* Top Header Bar */
        .reader-header {
            background: var(--card-bg);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            z-index: 10;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 0.95rem;
            color: var(--text-main);
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .icon-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Page Selection Controls */
        .page-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .page-input {
            width: 50px;
            padding: 5px;
            text-align: center;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: var(--bg-color);
            color: var(--text-main);
            font-weight: bold;
            font-size: 0.95rem;
            outline: none;
        }

        .page-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        .page-btn:hover {
            opacity: 0.9;
        }

        /* Full Reading Body */
        .reader-body {
            flex: 1;
            width: 100%;
            height: calc(100vh - 60px);
            display: flex;
            justify-content: center;
            align-items: center;
            background: #202020;
        }

        .pdf-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body oncontextmenu="return false;"> <!-- Disables right-click -->

    <!-- Header Navigation -->
    <div class="reader-header">
        <a href="books.html" class="icon-btn">
            <i class="fa-solid fa-arrow-left"></i> Back to Gallery
        </a>

        <!-- Page Number Controller -->
        <div class="page-controls">
            <button class="page-btn" onclick="changePage(-1)">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <span>Page</span>
            <input type="number" id="pageNumber" class="page-input" value="1" min="1" onchange="jumpToPage()">
            <button class="page-btn" onclick="changePage(1)">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

        <div>
            <button class="icon-btn" onclick="toggleDarkMode()">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </div>

    <!-- Full Reader Frame Container -->
    <div class="reader-body" id="readerBody"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const pdfFile = urlParams.get('file');
        const readerBody = document.getElementById('readerBody');
        let currentPage = 1;

        function loadPdf(page) {
            if (!pdfFile) {
                readerBody.innerHTML = '<h3 style="color: white;">No PDF file specified.</h3>';
                return;
            }

            // Build full absolute URL so mobile browsers can locate the PDF file accurately
            const fullPdfUrl = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/')) + '/' + pdfFile;
            
            // Mobile-friendly wrapper URL
            const mobileFriendlyUrl = `https://docs.google.com/gview?url=${encodeURIComponent(fullPdfUrl)}&embedded=true#page=${page}`;
            
            readerBody.innerHTML = `
                <iframe id="pdfFrame" class="pdf-frame" src="${mobileFriendlyUrl}"></iframe>
            `;
        }

        // Jump to typed page number
        function jumpToPage() {
            const inputVal = parseInt(document.getElementById('pageNumber').value);
            if (inputVal && inputVal > 0) {
                currentPage = inputVal;
                loadPdf(currentPage);
            }
        }

        // Change page using Previous/Next buttons
        function changePage(delta) {
            if (currentPage + delta >= 1) {
                currentPage += delta;
                document.getElementById('pageNumber').value = currentPage;
                loadPdf(currentPage);
            }
        }

        // Prevent standard keyboard save/print shortcuts
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 's')) {
                e.preventDefault();
                alert('Downloading and printing are disabled.');
            }
        });

        function toggleDarkMode() {
            document.body.classList.toggle('light-mode');
        }

        // Initialize page load
        loadPdf(currentPage);
    </script>
</body>
</html>
