<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Details</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-white min-h-screen p-6 sm:p-10">

    <main class="max-w-2xl mx-auto mt-8">
        <div class="flex items-center space-x-6">
            <!-- Flower Image on the Left -->
            <div class="flex-shrink-0">
                <img src="https://placehold.co/150x150/ffb6c1/ffffff?text=Flowers" 
                     onerror="this.src='https://placehold.co/150x150/e2e8f0/475569?text=Image'" 
                     alt="Flower Image" 
                     class="w-32 h-32 sm:w-40 sm:h-40 object-cover rounded shadow-md">
            </div>

            <!-- Text Details on the Right -->
            <div class="flex flex-col justify-center space-y-2">
                <div class="text-lg sm:text-xl font-bold text-black">
                    <span class="inline-block w-20">Title</span> : Matam amagi chanabi
                </div>
                <div class="text-lg sm:text-xl font-bold text-black">
                    <span class="inline-block w-20">Singer</span>: T. Robindro
                </div>
                <div class="text-lg sm:text-xl font-bold text-black">
                    <span class="inline-block w-20">lyrics</span> : T. Manao
                </div>
            </div>
        </div>
    </main>

</body>
</html>
