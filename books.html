<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books Gallery - Kanglei Gallery</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6c5ce7;
            --primary-hover: #5b4cc4;
            --bg-color: #f4f6fb;
            --card-bg: #ffffff;
            --text-main: #2d3436;
            --text-muted: #636e72;
            --nav-bg: #4b65f6;
        }

        body.dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Banner */
        .top-banner {
            background-color: var(--nav-bg);
            color: white;
            text-align: center;
            padding: 12px 20px;
            font-size: 1.1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .container {
            max-width: 950px;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
        }

        .section-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 25px;
            color: var(--text-main);
        }

        /* Search Bar */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 1rem;
            outline: none;
            background: var(--card-bg);
            color: var(--text-main);
        }

        .search-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* Book Cards */
        .book-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .book-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .book-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .book-icon {
            width: 70px;
            height: 70px;
            background: #ede9fe;
            color: var(--primary-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            flex-shrink: 0;
        }

        .book-info {
            flex: 1;
        }

        .book-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
            text-decoration: none;
            display: inline-block;
        }

        .book-title:hover {
            color: var(--primary-color);
        }

        .book-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .btn-read {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            text-decoration: none;
        }

        .btn-read:hover {
            background-color: var(--primary-hover);
        }

        /* Bottom Nav */
        .bottom-nav {
            background-color: var(--card-bg);
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-around;
            padding: 15px;
            position: sticky;
            bottom: 0;
        }

        .nav-link {
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @media (max-width: 600px) {
            .book-card {
                flex-direction: column;
                align-items: flex-start;
            }
            .btn-read {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Top Banner -->
    <div class="top-banner">
        Discover classical and contemporary literary works
    </div>

    <!-- Main Container -->
    <div class="container">
        <h2 class="section-title">Featured Book Collection</h2>

        <!-- Search Bar -->
        <div class="controls-bar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search books by title..." onkeyup="filterBooks()">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
        </div>

        <!-- Book List -->
        <div class="book-list" id="bookList">
            <!-- Books dynamically rendered via JavaScript -->
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a href="register.html" class="nav-link"><i class="fa-solid fa-user-plus"></i> Register</a>
        <a href="login.html" class="nav-link"><i class="fa-solid fa-right-to-bracket"></i> Log In</a>
        <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a>
    </div>

    <script>
        // Book database with direct PDF paths
        const books = [
            {
                id: 1,
                title: "Meetei Laining Ahanba",
                description: "Meetei Laininglon Ahoupa (Ahanba) - An insightful book exploring sacred teachings and history.",
                pdfUrl: "assets/laining1.pdf"
            },
            {
                id: 2,
                title: "Angangi Wari Macha",
                description: "A collection of delightful short stories and folk tales meant for children and young readers.",
                pdfUrl: "assets/angangi_wari_macha.pdf"
            },
            {
                id: 3,
                title: "Wakhal Khudum Chanba",
                description: "An insightful book exploring philosophical thoughts, life lessons, and deep reflection.",
                pdfUrl: "assets/wakhal_khudum_chanba.pdf"
            },
            {
                id: 4,
                title: "Nungaiba Thiba",
                description: "A creative literary piece focused on the search for peace, joy, and spiritual fulfillment.",
                pdfUrl: "assets/nungaiba_thiba.pdf"
            }
        ];

        // Render books to screen
        function renderBooks(bookArray) {
            const container = document.getElementById('bookList');
            container.innerHTML = '';

            bookArray.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <div class="book-icon">
                        <i class="fa-solid fa-file-pdf"></i>
                    </div>
                    <div class="book-info">
                        <a href="read.html?file=${encodeURIComponent(book.pdfUrl)}" class="book-title">${book.title}</a>
                        <div class="book-desc">${book.description}</div>
                    </div>
                    <a href="read.html?file=${encodeURIComponent(book.pdfUrl)}" class="btn-read">
                        <i class="fa-solid fa-book-open"></i> Read Details
                    </a>
                `;
                container.appendChild(card);
            });
        }

        // Filter Books on search
        function filterBooks() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = books.filter(b => 
                b.title.toLowerCase().includes(query) || 
                b.description.toLowerCase().includes(query)
            );
            renderBooks(filtered);
        }

        // Initialize display
        renderBooks(books);
    </script>
</body>
</html>
