<script>
        // Book database with cover paths pointing to the 'photo' folder
        const books = [
            {
                id: 1,
                title: "Meetei Laining Ahanba",
                description: "Meetei Laininglon Athuppa (Ahanba) - An insightful book exploring sacred teachings and history.",
                pdfUrl: "laining1.pdf",
                coverUrl: "photo/meeteilaining.png"
            },
            {
                id: 2,
                title: "THAJADABA MEEKUP AMADA",
                description: "A love story of two teenaged collage boy and girl.",
                pdfUrl: "thajadba.pdf",
                coverUrl: "photo/full cover.jpg"
            },
            {
                id: 3,
                title: "Wakhal Khudum Chanba",
                description: "An insightful book exploring philosophical thoughts, life lessons, and deep reflection.",
                pdfUrl: "wakhal_khudum_chanba.pdf",
                coverUrl: "photo/sanamahism copy.png"
            },
            {
                id: 4,
                title: "Nungaiba Thiba",
                description: "A creative literary piece focused on the search for peace, joy, and spiritual fulfillment.",
                pdfUrl: "nungaiba_thiba.pdf",
                coverUrl: "photo/full cover.jpg"
            }
        ];

        // Render books to screen
        function renderBooks(bookArray) {
            const container = document.getElementById('bookList');
            container.innerHTML = '';

            if (bookArray.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <i class="fa-solid fa-book-open" style="font-size:2rem; margin-bottom:10px; color:#00A86B;"></i>
                        <p>No books found matching your search.</p>
                    </div>
                `;
                return;
            }

            bookArray.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <img src="${book.coverUrl}" alt="${book.title} Cover" class="book-cover-img">
                    <div class="book-info">
                        <div class="info-row">
                            <span class="label">Title</span>
                            <span class="colon">:</span>
                            <a href="read.html?file=${encodeURIComponent(book.pdfUrl)}" class="value">${book.title}</a>
                        </div>
                        <div class="info-row" style="align-items: flex-start;">
                            <span class="label">Details</span>
                            <span class="colon">:</span>
                            <span class="value-desc">${book.description}</span>
                        </div>
                        <a href="read.html?file=${encodeURIComponent(book.pdfUrl)}" class="btn-read">
                            <i class="fa-solid fa-book-open"></i> Read Book
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Filter Books on search
        function filterBooks() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = books.filter(b => 
                b.title.toLowerCase().includes(query) || 
                b.description.toLowerCase().includes(query)
            );
            renderBooks(filtered);
        }

        // Initial render on page load
        renderBooks(books);
    </script>
