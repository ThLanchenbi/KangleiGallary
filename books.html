<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books Gallery - Kanglei Gallery</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6c5ce7;
            --primary-hover: #5b4cc4;
            --bg-color: #f4f6fb;
            --card-bg: #ffffff;
            --text-main: #2d3436;
            --text-muted: #636e72;
            --nav-bg: #4b65f6;
            --reader-bg: #ffffff;
            --reader-text: #2d3436;
        }

        body.dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --reader-bg: #181818;
            --reader-text: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        .top-banner {
            background-color: var(--nav-bg);
            color: white;
            text-align: center;
            padding: 12px 20px;
            font-size: 1.1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .container {
            max-width: 950px;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
        }

        .section-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 25px;
            color: var(--text-main);
        }

        /* Controls / Search */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 1rem;
            outline: none;
            background: var(--card-bg);
            color: var(--text-main);
        }

        .search-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* Book Cards */
        .book-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .book-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .book-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .book-icon {
            width: 70px;
            height: 70px;
            background: #ede9fe;
            color: var(--primary-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            flex-shrink: 0;
        }

        .book-info {
            flex: 1;
        }

        .book-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
            cursor: pointer;
        }

        .book-title:hover {
            color: var(--primary-color);
        }

        .book-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .btn-read {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-read:hover {
            background-color: var(--primary-hover);
        }

        /* Reading Modal / View */
        .reader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--reader-bg);
            z-index: 1000;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }

        .reader-overlay.active {
            display: flex;
        }

        .reader-header {
            position: sticky;
            top: 0;
            background: var(--card-bg);
            border-bottom: 1px solid #ddd;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .reader-header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--text-main);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
        }

        .icon-btn:hover {
            background-color: rgba(0,0,0,0.05);
        }

        .reader-body {
            max-width: 750px;
            margin: 40px auto;
            padding: 0 25px 60px 25px;
            color: var(--reader-text);
            line-height: 1.8;
            font-size: 1.15rem;
        }

        .reader-title {
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-align: center;
        }

        .reader-author {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 40px;
            font-style: italic;
        }

        .reader-content p {
            margin-bottom: 20px;
            text-indent: 20px;
        }

        /* Bottom Nav */
        .bottom-nav {
            background-color: var(--card-bg);
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-around;
            padding: 15px;
            position: sticky;
            bottom: 0;
        }

        .nav-link {
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @media (max-width: 600px) {
            .book-card {
                flex-direction: column;
                align-items: flex-start;
            }
            .btn-read {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Top Banner -->
    <div class="top-banner">
        Discover classical and contemporary literary works
    </div>

    <!-- Main Container -->
    <div class="container">
        <h2 class="section-title">Featured Book Collection</h2>

        <!-- Search Bar -->
        <div class="controls-bar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search books by title or description..." onkeyup="filterBooks()">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
        </div>

        <!-- Book List -->
        <div class="book-list" id="bookList">
            <!-- Books will be dynamically injected here -->
        </div>
    </div>

    <!-- Reader Modal View -->
    <div class="reader-overlay" id="readerOverlay">
        <div class="reader-header">
            <button class="icon-btn" onclick="closeReader()" title="Close Reader">
                <i class="fa-solid fa-arrow-left"></i> Back
            </button>
            <div class="reader-header-actions">
                <button class="icon-btn" onclick="adjustFontSize(1)" title="Increase Font"><i class="fa-solid fa-plus"></i></button>
                <button class="icon-btn" onclick="adjustFontSize(-1)" title="Decrease Font"><i class="fa-solid fa-minus"></i></button>
                <button class="icon-btn" onclick="toggleDarkMode()" title="Toggle Dark/Light Mode"><i class="fa-solid fa-moon"></i></button>
            </div>
        </div>
        <div class="reader-body">
            <h1 class="reader-title" id="activeBookTitle">Book Title</h1>
            <div class="reader-author" id="activeBookAuthor">Author Name</div>
            <div class="reader-content" id="activeBookContent">
                <!-- Book content injected here -->
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a href="register.html" class="nav-link"><i class="fa-solid fa-user-plus"></i> Register</a>
        <a href="login.html" class="nav-link"><i class="fa-solid fa-right-to-bracket"></i> Log In</a>
        <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a>
    </div>

    <script>
        // Book Database
        const books = [
            {
                id: 1,
                title: "Angangi Wari Macha",
                author: "Manipuri Folk Tale Collection",
                description: "A collection of delightful short stories and folk tales meant for children and young readers.",
                content: `
                    <p>Khamba and Thoibi were two prominent figures in the folklore of Moirang, an ancient kingdom in Manipuri tradition. Their legend has been passed down through generations in the form of song, dance, and epic storytelling.</p>
                    <p>Once upon a time, in a peaceful village surrounded by lush green hills, children gathered under the big banyan tree to listen to the wise elders. The stories told of brave warriors, magical animals, and the timeless lessons of honesty, courage, and love for nature.</p>
                    <p>Every tale held a special meaning, teaching young minds to respect their traditions and cherish the beauty of their homeland.</p>
                `
            },
            {
                id: 2,
                title: "Wakhal Khudum Chanba",
                author: "Philosophical Essays",
                description: "An insightful book exploring philosophical thoughts, life lessons, and deep reflection.",
                content: `
                    <p>Life is a journey of continuous reflection. Human thoughts are like waves in a river—constantly moving, shaping the banks of our character and decisions.</p>
                    <p>To understand the self, one must practice mindfulness and quiet contemplation. In this section, we examine the inner peace that comes from embracing simple living, high thinking, and empathy toward all living beings.</p>
                    <p>True wisdom lies not in knowing everything, but in understanding how little we know and constantly striving to grow in wisdom and compassion.</p>
                `
            },
            {
                id: 3,
                title: "Nungaiba Thiba",
                author: "Literary Collection",
                description: "A creative literary piece focused on the search for peace, joy, and spiritual fulfillment.",
                content: `
                    <p>The pursuit of happiness is a universal quest. Many seek it in wealth or fame, yet true fulfillment often resides in the quiet moments of connection and gratitude.</p>
                    <p>In this narrative, the protagonist embarks on a journey through the serene landscapes of Manipur—from the tranquil waters of Loktak Lake to the hills of Ukhrul—discovering that peace is found within oneself.</p>
                    <p>Through every trial and triumph, the warmth of community and faith shines light upon the path toward harmony.</p>
                `
            }
        ];

        let currentFontSize = 1.15;

        // Render books to the page
        function renderBooks(bookArray) {
            const container = document.getElementById('bookList');
            container.innerHTML = '';

            bookArray.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <div class="book-icon">
                        <i class="fa-solid fa-book-open"></i>
                    </div>
                    <div class="book-info">
                        <div class="book-title" onclick="openReader(${book.id})">${book.title}</div>
                        <div class="book-desc">${book.description}</div>
                    </div>
                    <button class="btn-read" onclick="openReader(${book.id})">
                        <i class="fa-solid fa-book-reader"></i> Read Details
                    </button>
                `;
                container.appendChild(card);
            });
        }

        // Search/Filter function
        function filterBooks() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = books.filter(b => 
                b.title.toLowerCase().includes(query) || 
                b.description.toLowerCase().includes(query)
            );
            renderBooks(filtered);
        }

        // Open Reader Modal
        function openReader(bookId) {
            const book = books.find(b => b.id === bookId);
            if (!book) return;

            document.getElementById('activeBookTitle').innerText = book.title;
            document.getElementById('activeBookAuthor').innerText = book.author;
            document.getElementById('activeBookContent').innerHTML = book.content;

            document.getElementById('readerOverlay').classList.add('active');
            document.body.style.overflow = 'hidden'; // Stop background scrolling
        }

        // Close Reader Modal
        function closeReader() {
            document.getElementById('readerOverlay').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Font Size Toggle
        function adjustFontSize(delta) {
            currentFontSize += delta * 0.1;
            if (currentFontSize < 0.8) currentFontSize = 0.8;
            if (currentFontSize > 2.0) currentFontSize = 2.0;
            document.getElementById('activeBookContent').style.fontSize = currentFontSize + 'rem';
        }

        // Dark Mode Toggle
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }

        // Initial render
        renderBooks(books);
    </script>
</body>
</html>
