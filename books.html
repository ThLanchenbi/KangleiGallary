<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanglei Art Gallery - Books</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #009688; /* Teal background matching your theme */
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Big Header Styling */
        .main-header {
            text-align: center;
            color: #ffffff;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        /* Book Card Style */
        .book-card {
            background: #ffffff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, border 0.2s;
            border: 2px solid transparent;
        }

        .book-card:hover {
            transform: translateY(-2px);
        }

        /* Thumbnail / Cover placeholder */
        .book-thumb {
            width: 80px;
            height: 110px;
            object-fit: cover;
            border-radius: 4px;
            margin-right: 20px;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #666;
            text-align: center;
            font-weight: bold;
        }

        /* Details layout */
        .book-details {
            flex-grow: 1;
        }

        .book-info {
            display: grid;
            grid-template-columns: 70px 15px 1fr;
            font-size: 15px;
            color: #333;
            line-height: 1.6;
        }

        .label {
            font-weight: bold;
        }

        /* Read PDF Button */
        .read-btn {
            display: inline-block;
            margin-top: 10px;
            background-color: #8b0000;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .read-btn:hover {
            background-color: #a00000;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Big Heading -->
        <div class="main-header">KANGLEI BOOKS GALLERY</div>

        <!-- Book 1: Dharmam -->
        <div class="book-card">
            <div class="book-thumb">PDF Cover</div>
            <div class="book-details">
                <div class="book-info"><span class="label">Title</span><span>:</span><span>Dharmam</span></div>
                <div class="book-info"><span class="label">Category</span><span>:</span><span>Story / Literature</span></div>
                <div>
                    <a href="story/dharmam.pdf" class="read-btn" target="_blank">📖 Read / Open PDF</a>
                </div>
            </div>
        </div>

        <!-- Book 2: Thajadba -->
        <div class="book-card">
            <div class="book-thumb">PDF Cover</div>
            <div class="book-details">
                <div class="book-info"><span class="label">Title</span><span>:</span><span>Thajadba</span></div>
                <div class="book-info"><span class="label">Category</span><span>:</span><span>Story / Literature</span></div>
                <div>
                    <a href="story/thajadba.pdf" class="read-btn" target="_blank">📖 Read / Open PDF</a>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
